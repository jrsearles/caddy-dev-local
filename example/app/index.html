<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>devlocal example</title>
    <style>
        body {
            font-family: system-ui, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: #0d1117;
            color: #c9d1d9;
        }
        .container {
            text-align: center;
            padding: 3rem;
            border: 1px solid #30363d;
            border-radius: 12px;
            background: #161b22;
        }
        h1 { color: #58a6ff; margin-bottom: 0.5rem; }
        p { color: #8b949e; }
        code {
            background: #21262d;
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>devlocal is working!</h1>
        <p>This page is served from the <code>web</code> container.</p>
        <p>Try visiting <code>example.web.dev.local</code></p>
    </div>
</body>
</html>
